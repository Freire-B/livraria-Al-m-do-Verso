<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Além do Verso | Fale Conosco</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/script.js" defer></script>
</head>
<body>

    <header class="header">
        <a href="../index.html" class="logo-texto">Além do Verso</a>
        <div class="perfil-icon" title="Meu Perfil">👤</div>
    </header>

    <div class="container-voltar">
        <a href="pagina1.html" class="btn-voltar" title="Voltar">&lt;</a>
    </div>

    <main class="container">
        <section class="secao-form">
            <form id="form-contato" class="form-base">
                <div class="campo-grupo">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo..." required minlength="3">
                </div>

                <div class="campo-grupo">
                    <label for="email">E-mail de Contato</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="campo-grupo">
                    <label for="data">Data de Preferência para Atendimento</label>
                    <div class="input-com-icone">
                        <span class="icone-campo">📅</span>
                        <input type="date" id="data" name="data">
                    </div>
                </div>

                <div class="campo-grupo">
                    <label for="mensagem">Mensagem / Dúvidas sobre Pedidos</label>
                    <textarea id="mensagem" name="mensagem" rows="8" placeholder="Escreva aqui suas dúvidas, sugestões ou encomendas especiais..." required></textarea>
                </div>

                <div id="feedback-mensagem" style="text-align: center; font-weight: bold; margin-top: 10px;"></div>

                <div class="container-btn-submit">
                    <button type="submit" class="btn-submit">Enviar Mensagem</button>
                </div>
            </form>
        </section>

        <nav class="paginacao">
            <a href="../index.html" class="btn-pag">1</a>
            <a href="pagina1.html" class="btn-pag">2</a>
            <a href="contato.html" class="btn-pag active">3</a>
        </nav>
    </main>

    <footer class="footer">
        <div class="rodape-texto">© 2026 Livraria Além do Verso — Todos os direitos reservados.</div>
        <div class="perfil-icon" title="Ajuda">👤</div>
    </footer>

</body>
</html>
