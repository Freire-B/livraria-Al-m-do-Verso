<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Livro | Além do Verso</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/script.js" defer></script>
    <style>
        .cadastro-wrapper {
            max-width: 650px;
            margin: 30px auto;
            background-color: #2b1d17;
            border: 1px solid #5a4238;
            border-radius: 8px;
            padding: 28px;
        }
        .cadastro-wrapper h2 {
            margin-bottom: 20px;
            color: #f0e6e0;
        }
        .campo-grupo {
            margin-bottom: 16px;
        }
        .campo-grupo label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #e2d5ce;
        }
        .campo-grupo input,
        .campo-grupo select,
        .campo-grupo textarea {
            width: 100%;
            padding: 10px 12px;
            background-color: #1f1410;
            border: 1px solid #5a4238;
            border-radius: 5px;
            color: #f0e6e0;
            font-size: 0.95rem;
        }
        .linha-dupla {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .preview-box {
            margin-top: 10px;
            text-align: center;
        }
        .preview-box img {
            max-height: 200px;
            border-radius: 6px;
            border: 1px solid #5a4238;
            display: none;
            margin: 0 auto;
        }
        .btn-salvar {
            width: 100%;
            padding: 12px;
            background-color: #4a332a;
            color: #f0e6e0;
            border: 1px solid #755649;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-salvar:hover {
            background-color: #614337;
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="/index.html" class="logo-texto">Além do Verso</a>
    </header>

    <main class="container">
        <section class="cadastro-wrapper">
            <h2>Cadastrar Novo Livro</h2>

            <form id="form-cadastro-livro" enctype="multipart/form-data">
                <div class="campo-grupo">
                    <label for="titulo">Título *</label>
                    <input type="text" id="titulo" name="titulo" required placeholder="Ex: Jujutsu Kaisen Vol. 2">
                </div>

                <div class="campo-grupo">
                    <label for="autor">Autor *</label>
                    <input type="text" id="autor" name="autor" required placeholder="Ex: Gege Akutami">
                </div>

                <div class="linha-dupla">
                    <div class="campo-grupo">
                        <label for="preco">Preço (R$) *</label>
                        <input type="number" id="preco" name="preco" step="0.01" min="0" required placeholder="49.90">
                    </div>

                    <div class="campo-grupo">
                        <label for="id_categoria">Categoria *</label>
                        <select id="id_categoria" name="id_categoria" required>
                            <option value="1">Mangás</option>
                            <option value="2">HQs</option>
                            <option value="3">Romance</option>
                        </select>
                    </div>
                </div>

                <div class="campo-grupo">
                    <label for="imagem">Capa do livro (Arquivo do dispositivo)</label>
                    <input type="file" id="imagem" name="imagem" accept="image/*">
                </div>

                <div class="campo-grupo">
                    <label for="imagem_url">Ou cole a URL da imagem</label>
                    <input type="url" id="imagem_url" name="imagem_url" placeholder="https://...">
                </div>

                <div class="preview-box">
                    <img id="preview-capa" alt="Pré-visualização da capa">
                </div>

                <div class="campo-grupo">
                    <label for="sinopse">Sinopse</label>
                    <textarea id="sinopse" name="sinopse" rows="4" placeholder="Descreva a história do livro..."></textarea>
                </div>

                <button type="submit" id="btn-submit-livro" class="btn-salvar">Salvar Livro</button>
            </form>
        </section>
    </main>
</body>
</html>
